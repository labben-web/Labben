<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labben | Sillones de Diseño y Confort</title>
    
    <!-- Google Analytics 4 (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-XXXXXXXXXX');
    </script>

    <style>
        :root {
            --primary: #2c3e50;
            --accent: #c0392b;
            --bg: #f8f9fa;
            --text: #333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); line-height: 1.6; }
        
        header { background: #fff; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; }
        .logo { font-size: 28px; font-weight: bold; color: var(--primary); letter-spacing: 2px; }
        .cart-status { font-weight: bold; color: var(--accent); }

        .hero { background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1555041469-a586c61ea9bc?auto=format&fit=crop&w=1200&q=80') center/cover; color: white; text-align: center; padding: 80px 20px; margin-bottom: 40px; }
        .hero h1 { font-size: 42px; margin-bottom: 10px; }
        .hero p { font-size: 18px; margin-bottom: 20px; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .catalog { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; margin-bottom: 50px; }
        
        .card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; height: 220px; object-fit: cover; }
        .card-body { padding: 20px; }
        .card-title { font-size: 20px; margin-bottom: 10px; color: var(--primary); }
        .card-price { font-size: 18px; font-weight: bold; color: var(--accent); margin-bottom: 15px; }
        
        button { background: var(--primary); color: white; border: none; padding: 10px 18px; border-radius: 4px; cursor: pointer; font-size: 14px; width: 100%; transition: background 0.2s; }
        button:hover { background: #1a252f; }
        .btn-checkout { background: var(--accent); margin-top: 20px; padding: 15px; font-size: 16px; }
        .btn-checkout:hover { background: #a93226; }

        footer { background: var(--primary); color: white; text-align: center; padding: 30px; margin-top: 50px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">LABBEN</div>
        <div class="cart-status">Carrito: <span id="cart-count">0</span> productos</div>
    </header>

    <section class="hero">
        <h1>Sillones de Diseño para tu Hogar</h1>
        <p>Elegancia, confort y calidad superior en cada detalle.</p>
    </section>

    <div class="container">
        <h2 style="margin-bottom: 20px; text-align: center;">Nuestra Colección</h2>
        <div class="catalog">
            
            <!-- Producto 1 -->
            <div class="card">
                <img src="https://images.unsplash.com/photo-1555041469-a586c61ea9bc?auto=format&fit=crop&w=600&q=80" alt="Sillón Nordik">
                <div class="card-body">
                    <div class="card-title">Sillón Nordik 3 Cuerpos</div>
                    <div class="card-price">$250.000</div>
                    <button onclick="agregarAlCarrito('Sillón Nordik 3 Cuerpos', 250000)">Agregar al Carrito</button>
                </div>
            </div>

            <!-- Producto 2 -->
            <div class="card">
                <img src="https://images.unsplash.com/photo-1586023492125-27b2c045efd7?auto=format&fit=crop&w=600&q=80" alt="Sillón Velvet Ultra">
                <div class="card-body">
                    <div class="card-title">Sillón Individual Velvet</div>
                    <div class="card-price">$120.000</div>
                    <button onclick="agregarAlCarrito('Sillón Individual Velvet', 120000)">Agregar al Carrito</button>
                </div>
            </div>

            <!-- Producto 3 -->
            <div class="card">
                <img src="https://images.unsplash.com/photo-1493663284031-b7e3aefcae8e?auto=format&fit=crop&w=600&q=80" alt="Sillón Corner Modern">
                <div class="card-body">
                    <div class="card-title">Sillón Esquinero Modern</div>
                    <div class="card-price">$410.000</div>
                    <button onclick="agregarAlCarrito('Sillón Esquinero Modern', 410000)">Agregar al Carrito</button>
                </div>
            </div>

        </div>

        <div style="max-width: 400px; margin: 0 auto; text-align: center;">
            <button class="btn-checkout" onclick="iniciarCompra()">Finalizar Compra / Cotizar</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Labben - Muebles y Sillones de Diseño</p>
    </footer>

    <script>
        let carrito = [];

        function agregarAlCarrito(nombre, precio) {
            carrito.push({ nombre, precio });
            document.getElementById('cart-count').innerText = carrito.length;
            alert('¡' + nombre + ' agregado al carrito!');

            // Registrar evento de producto agregado en Google Analytics
            gtag('event', 'add_to_cart', {
                'currency': 'ARS',
                'value': precio,
                'items': [{
                    'item_name': nombre,
                    'price': precio
                }]
            });
        }

        function iniciarCompra() {
            if (carrito.length === 0) {
                alert('El carrito está vacío.');
                return;
            }

            let total = carrito.reduce((sum, item) => sum + item.precio, 0);

            // Registrar evento de checkout en Google Analytics
            gtag('event', 'begin_checkout', {
                'currency': 'ARS',
                'value': total,
                'items_count': carrito.length
            });

            alert('¡Gracias por tu interés en Labben! Se ha registrado tu orden de prueba por un total de $' + total);
        }
    </script>
</body>
</html>
