<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Proyecto</title>
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX');
    </script>

    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; line-height: 1.6; }
        header { background: #333; color: white; padding: 20px; text-align: center; border-radius: 8px; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 5px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <header>
        <h1>Mi Sitio Web para la Materia</h1>
    </header>
    <main>
        <h2>Bienvenido</h2>
        <p>Este es el sitio web del proyecto universitario. Próximamente incluirá más contenido.</p>
        
        <button id="btn-interaccion">Probar Clic</button>
    </main>

    <script>
      // Registrar un clic en Google Analytics
      document.getElementById('btn-interaccion').addEventListener('click', function() {
        alert('¡Evento registrado!');
        gtag('event', 'clic_boton_prueba', {
          'categoria': 'interaccion_usuario'
        });
      });
    </script>
</body>
</html>
